name: Build hachimi_ura 3.29.2 (log fix)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ura-3292-v3.yml"
      - ".github/scripts/apply_logfix_3292.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ura-3292-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply all fixes (idempotent)
        run: |
          set -euo pipefail
          node .github/scripts/apply_offset_fix_3292.js so/hachimi_ura_plugin/src/lib.rs | tee ci-capture.txt
          node .github/scripts/apply_arrayfix_3292.js so/hachimi_ura_plugin/src/lib.rs | tee -a ci-capture.txt
          node .github/scripts/apply_logfix_3292.js so/hachimi_ura_plugin/src/lib.rs | tee -a ci-capture.txt
          grep -qF 'LOG-FIX-3292' so/hachimi_ura_plugin/src/lib.rs
          grep -qF 'debug/ringlog' so/hachimi_ura_plugin/src/lib.rs
          ! grep -qF 'jp.pokemon.pokeuma' so/hachimi_ura_plugin/src/lib.rs
          echo "log fix verified" | tee -a ci-capture.txt

      - name: Rust target + NDK linker
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android 2>&1 | tee -a ci-capture.txt
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TC/aarch64-linux-android24-clang"
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\n' "$TC" \
            > so/hachimi_ura_plugin/.cargo/config.toml
          {
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TC/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: cargo build (release, aarch64)
        working-directory: so/hachimi_ura_plugin
        run: |
          set -o pipefail
          cargo build --release --target aarch64-linux-android 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-capture.txt" | tail -60
          ls -l target/aarch64-linux-android/release/libhachimi_ura.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-3.29.2-logfix
          path: so/hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          if-no-files-found: error

      - name: Publish patched source and .so into repo
        if: success()
        run: |
          set -euo pipefail
          mkdir -p so/dist
          cp so/hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so \
             so/dist/libhachimi_ura-3.29.2-logfix.so
          git config user.name "dsh-bot"
          git config user.email "dsh-bot@users.noreply.github.com"
          git add -f so/hachimi_ura_plugin/src/lib.rs so/dist/libhachimi_ura-3.29.2-logfix.so
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "build(so): 3.29.2 log fix (run ${{ github.run_id }})"
            git push
          fi

      - name: Report (always)
        if: always()
        run: |
          {
            echo "job_status=${{ job.status }}"
            tail -c 6000 ci-capture.txt 2>/dev/null || echo "no capture"
          } > ci-last-v3.txt
          git config user.name "dsh-bot"
          git config user.email "dsh-bot@users.noreply.github.com"
          git add ci-last-v3.txt || true
          git commit -m "ci: v3 build log (${{ job.status }})" || echo "nothing"
          git push || echo "push failed"