name: "Build matsuri AI app v4 (内置引擎+多端口)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-app-v2.yml"
      - ".github/scripts/apply_appfix_081.js"
      - ".github/scripts/apply_appfix_082.js"
      - ".github/scripts/apply_appfix_083.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 0.7.4 baseline (port 18766, original UI)
        run: |
          set -euo pipefail
          git checkout 4a0009f3 -- app/app/src/main
          grep -c '18766' app/app/src/main/assets/index.html || true

      - name: Bundle umaai engine + game data into the APK
        run: |
          set -euo pipefail
          mkdir -p app/app/src/main/jniLibs/arm64-v8a app/app/src/main/assets/engine/data
          cp app/engine/libmatsuri_engine-arm64.so app/app/src/main/jniLibs/arm64-v8a/libmatsuri_engine.so
          chmod 0755 app/app/src/main/jniLibs/arm64-v8a/libmatsuri_engine.so
          REF=4bc0e653aebe5eca99e00abf4accff07a6cdf6bc
          for f in constants.json cardDB.json umaDB.json events.json scenario_matsuri.json text_data_dict.json manifest.json ai_config.toml matsuri_config.toml; do
            curl -sSL "https://raw.githubusercontent.com/umaai-project/umaai-matsuri/$REF/data/$f" -o "app/app/src/main/assets/engine/data/$f"
          done
          ls -l app/app/src/main/jniLibs/arm64-v8a/
          du -sh app/app/src/main/assets/engine/data

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Stable debug keystore
        run: |
          set -e
          mkdir -p app/ci
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/ci/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Rank table (pin upstream 4bc0e653 data/constants.json)
        run: |
          set -euo pipefail
          curl -sSL "https://raw.githubusercontent.com/umaai-project/umaai-matsuri/4bc0e653aebe5eca99e00abf4accff07a6cdf6bc/data/constants.json" -o /tmp/consts.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/consts.json','utf8'));fs.writeFileSync('.github/scripts/rank_table.json',JSON.stringify({rank_scores:c.rank_scores,rank_names:c.rank_names}));console.log('rank table',c.rank_scores.length);"

      - name: Apply app fixes
        run: |
          set -euo pipefail
          : > app-capture.txt
          node .github/scripts/apply_appfix_080.js app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt app/app/src/main/assets/index.html app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_081.js app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt app/app/src/main/assets/index.html app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_082.js app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_083.js app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt 2>&1 | tee -a app-capture.txt
          grep -qF '[APP-FIX-081]' app/app/src/main/assets/index.html
          grep -qF '[ENGINE-ANDROID]' app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt
          grep -qF '[APP-FIX-083]' app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt
          sed -i 's/versionName = "[^"]*"/versionName = "0.9.4-dsh13"/' app/app/build.gradle.kts
          sed -i 's/versionCode = [0-9]\+/versionCode = 29/' app/app/build.gradle.kts
          grep -E 'versionCode|versionName' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble release
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -40
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-0.9.4-dsh13.apk
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-0.9.4-dsh13.apk app/dist/matsuri-ai-latest.apk
          git add -f app/app/src/main/java app/app/src/main/assets/index.html app/app/build.gradle.kts 2>/dev/null || true
          git commit -m "build(app): 0.9.4-dsh13 端口回退+纯拉收帧，可三软同开" || echo nothing
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: matsuri-ai-0.9.4-dsh13
          path: app/dist/matsuri-ai-0.9.4-dsh13.apk

      - name: Report (always)
        if: always()
        run: |
          { echo "job_status=${{ job.status }}"; tail -c 4000 app-capture.txt 2>/dev/null || true; } > ci-last-app-v2.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-app-v2.txt || true
          git commit -m "ci: app v4 log (${{ job.status }})" || echo nothing
          git push || echo "push failed"