name: "Build matsuri AI app v14 (kensan)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-app-v2.yml"
      - ".github/scripts/apply_appfix_081.js"
      - ".github/scripts/apply_appfix_082.js"
      - ".github/scripts/apply_appfix_083.js"
      - ".github/scripts/apply_appfix_084.js"
      - ".github/scripts/apply_appfix_085.js"
      - ".github/scripts/apply_appfix_089.js"
      - ".github/scripts/apply_appfix_090.js"
      - ".github/scripts/apply_appfix_091.js"
      - "app/app/src/main/java/com/ranko/matsuricapture/EngineBridge.kt"
      - "app/app/src/main/java/com/ranko/matsuricapture/FrameAdapter.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 0.7.4 baseline
        run: |
          set -euo pipefail
          git checkout 4a0009f3 -- app/app/src/main

      - name: Clone upstream + patch engine (panel json) + cross-build arm64
        run: |
          set -euo pipefail
          mkdir -p /tmp/w
          [ -d /tmp/w/umaai_next/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-next.git /tmp/w/umaai_next
          [ -d /tmp/w/umaai-matsuri/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/w/umaai-matsuri
          node .github/scripts/apply_engine_json_panel.js /tmp/w/umaai-matsuri/crates/matsuri-ai/src/output.rs
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/w/umaai-matsuri/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\n' "$TC" > /tmp/w/umaai-matsuri/.cargo/config.toml
          { echo "CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang"; echo "AR_aarch64_linux_android=$TC/llvm-ar"; } >> "$GITHUB_ENV"
          cd /tmp/w/umaai-matsuri
          cargo build --release --target aarch64-linux-android -p matsuri-cli 2>&1 | tail -5
          mkdir -p "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/matsuri "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a/libmatsuri_engine.so"
          ls -l "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a/"

      - name: Bundle data
        run: |
          set -euo pipefail
          mkdir -p app/app/src/main/assets/engine/data
          cp /tmp/w/umaai-matsuri/data/*.json /tmp/w/umaai-matsuri/data/*.toml app/app/src/main/assets/engine/data/ 2>/dev/null || true
          du -sh app/app/src/main/assets/engine/data

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Stable debug keystore
        run: |
          set -e
          mkdir -p app/ci
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/ci/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Rank table (from bundled constants.json)
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app/app/src/main/assets/engine/data/constants.json','utf8'));fs.writeFileSync('.github/scripts/rank_table.json',JSON.stringify({rank_scores:c.rank_scores,rank_names:c.rank_names}));console.log('rank table',c.rank_scores.length);"

      - name: Apply app fixes
        run: |
          set -euo pipefail
          : > app-capture.txt
          K=app/app/src/main/java/com/ranko/matsuricapture
          run() { node ".github/scripts/apply_appfix_$1.js" "${@:2}" 2>&1 | tee -a app-capture.txt; }
          run 080 $K/NativeEngine.kt app/app/src/main/assets/index.html app/app/build.gradle.kts
          run 081 $K/NativeEngine.kt app/app/src/main/assets/index.html app/app/build.gradle.kts
          run 082 $K/NativeEngine.kt
          run 083 $K/NativeEngine.kt
          run 084 $K/MainActivity.kt $K/FloatingWindowService.kt
          run 085 app/app/build.gradle.kts
          run 089 app/app/src/main/assets/index.html
          run 090 $K/FrameAdapter.kt
          run 091 $K/FrameAdapter.kt
          grep -qF '[APP-FIX-089]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-090]' $K/FrameAdapter.kt
          grep -qF '[APP-FIX-091]' $K/FrameAdapter.kt
          grep -qF 'startOne' $K/EngineBridge.kt
          sed -i 's/versionName = "[^"]*"/versionName = "0.9.12-dsh21"/' app/app/build.gradle.kts
          sed -i 's/versionCode = [0-9]\+/versionCode = 37/' app/app/build.gradle.kts
          grep -E 'versionCode|versionName' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble release
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -30
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-0.9.12-dsh21.apk
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-0.9.12-dsh21.apk app/dist/matsuri-ai-latest.apk
          git add -f app/app/src/main/java app/app/src/main/assets/index.html app/app/build.gradle.kts 2>/dev/null || true
          git commit -m "build(app): 0.9.12-dsh21 kensan 映射" || echo nothing
          git push || echo "push failed"

      - name: Report (always)
        if: always()
        run: |
          { echo "job_status=${{ job.status }}"; tail -c 5000 app-capture.txt 2>/dev/null || true; } > ci-last-app-v14.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-app-v14.txt || true
          git commit -m "ci: app v14 log (${{ job.status }})" || echo nothing
          git pull --rebase --autostash || true
          git push || echo "push failed"