name: "Build matsuri AI app v27 (SO纯采集+App算分)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-app-v2.yml"
      - "app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt"
      - "app/app/src/main/java/com/ranko/matsuricapture/ScoreTable.kt"
      - ".github/scripts/apply_appfix_081.js"
      - ".github/scripts/apply_appfix_082.js"
      - ".github/scripts/apply_appfix_083.js"
      - ".github/scripts/apply_appfix_084.js"
      - ".github/scripts/apply_appfix_085.js"
      - ".github/scripts/apply_appfix_089.js"
      - ".github/scripts/apply_appfix_090.js"
      - ".github/scripts/apply_appfix_091.js"
      - ".github/scripts/apply_appfix_092.js"
      - ".github/scripts/apply_appfix_093.js"
      - ".github/scripts/apply_appfix_094.js"
      - ".github/scripts/apply_appfix_095.js"
      - ".github/scripts/apply_appfix_096.js"
      - ".github/scripts/apply_appfix_097.js"
      - ".github/scripts/apply_appfix_098.js"
      - ".github/scripts/apply_appfix_099.js"
      - ".github/scripts/apply_appfix_100.js"
      - ".github/scripts/apply_appfix_102.js"
      - ".github/scripts/apply_appfix_103.js"
      - ".github/scripts/apply_appfix_104.js"
      - ".github/scripts/apply_engine_json_view.js"
      - "app/app/src/main/java/com/ranko/matsuricapture/EngineBridge.kt"
      - "app/app/src/main/java/com/ranko/matsuricapture/FrameAdapter.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [APP-FIX-105] 0.7.4 baseline restore 已删除：仓库内 app 源码现在是全量合并后的权威版本，
      # 直接构建即可（旧补丁脚本靠 marker 幂等空转，不再每次从基线重放）。

      - name: Clone upstream + patch engine (panel json + view) + cross-build arm64
        run: |
          set -euo pipefail
          mkdir -p /tmp/w
          [ -d /tmp/w/umaai_next/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-next.git /tmp/w/umaai_next
          rm -rf /tmp/w/umaai-matsuri
          # PR#3（GA 三档定参/按帧内卡组选档/自选比赛期限）已于 2026-11-09 合入上游 main（1914a18），直接构建 main
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/w/umaai-matsuri
          git -C /tmp/w/umaai-matsuri log --oneline -3
          node .github/scripts/apply_engine_json_panel.js /tmp/w/umaai-matsuri/crates/matsuri-ai/src/output.rs
          node .github/scripts/apply_engine_json_view.js /tmp/w/umaai-matsuri/crates/matsuri-ai/src/output.rs
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/w/umaai-matsuri/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\n' "$TC" > /tmp/w/umaai-matsuri/.cargo/config.toml
          { echo "CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang"; echo "AR_aarch64_linux_android=$TC/llvm-ar"; } >> "$GITHUB_ENV"
          cd /tmp/w/umaai-matsuri
          cargo build --release --target aarch64-linux-android -p matsuri-cli 2>&1 | tail -5
          mkdir -p "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/matsuri "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a/libmatsuri_engine.so"
          ls -l "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a/"
          # [APP-CFG-3294] 兼容性：armeabi-v7a（32 位老机）尽力构建，失败不阻塞主包（arm64 兜底）
          rustup target add armv7-linux-androideabi || true
          printf '[target.armv7-linux-androideabi]\nlinker = "%s/armv7a-linux-androideabi24-clang"\n' "$TC" >> .cargo/config.toml
          { echo "CC_armv7_linux_androideabi=$TC/armv7a-linux-androideabi24-clang"; echo "AR_armv7_linux_androideabi=$TC/llvm-ar"; } >> "$GITHUB_ENV"
          if cargo build --release --target armv7-linux-androideabi -p matsuri-cli 2>&1 | tail -3; then
            mkdir -p "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/armeabi-v7a"
            cp target/armv7-linux-androideabi/release/matsuri "$GITHUB_WORKSPACE/app/app/src/main/jniLibs/armeabi-v7a/libmatsuri_engine.so" \
              && echo "armv7 engine bundled" || echo "armv7 copy skipped"
          else
            echo "armv7 build failed（非阻塞，arm64 照常）"
          fi

      - name: Bundle data
        run: |
          set -euo pipefail
          mkdir -p app/app/src/main/assets/engine/data
          cp /tmp/w/umaai-matsuri/data/*.json /tmp/w/umaai-matsuri/data/*.toml app/app/src/main/assets/engine/data/ 2>/dev/null || true
          du -sh app/app/src/main/assets/engine/data

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Stable debug keystore (committed in repo)
        run: |
          set -e
          mkdir -p app/ci
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/ci/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git add -f app/ci/debug.keystore
            git commit -m "chore: 固定 debug keystore（签名稳定，免卸载重装）" || true
            git pull --rebase --autostash || true
            git push || true
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      # [APP-SCORE-3293] 仓库源码即权威，不再重放 apply_appfix_* 补丁。
      # 080（SO 算分接入）已被 3293 本地算分取代，重放会因锚点缺失而失败并把旧代码注回来。
      - name: Verify app fixes present
        run: |
          set -euo pipefail
          : > app-capture.txt
          K=app/app/src/main/java/com/ranko/matsuricapture
          grep -qF '[APP-SHINE-3293]' $K/NativeEngine.kt
          grep -qF '[APP-SCORE-3294]' $K/ScoreTable.kt
          grep -qF '[APP-SCORE-3294]' $K/NativeEngine.kt
          grep -qF '[APP-CFG-3294]' $K/EngineBridge.kt
          grep -qF '[APP-FIX-106]' $K/FloatingWindowService.kt
          grep -qF '[APP-CFG-3294]' app/app/src/main/assets/float.html
          grep -qF '[APP-CFG-3295]' $K/MainActivity.kt
          grep -qF '[APP-CFG-3295]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-107]' app/app/src/main/assets/float.html
          grep -qF '[APP-FIX-107]' app/app/src/main/assets/index.html
          grep -qF '[APP-BOARD-3295]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-108]' app/app/src/main/assets/index.html
          grep -qF '[APP-BOARD-3296]' app/app/src/main/assets/index.html
          ! grep -qF '冠军手写档 <span class="badge">gp_pi' app/app/src/main/assets/index.html
          ! grep -qF 'iv(summary, "score")' $K/NativeEngine.kt
          grep -qF '[APP-FIX-089]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-090]' $K/FrameAdapter.kt
          grep -qF '[APP-FIX-091]' $K/FrameAdapter.kt
          grep -qF '[APP-FIX-092]' $K/EngineBridge.kt
          grep -qF '[APP-FIX-093]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-094]' $K/FloatingWindowService.kt
          grep -qF '[APP-FIX-095]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-096]' $K/EngineBridge.kt
          grep -qF '[APP-FIX-097]' $K/FrameAdapter.kt
          grep -qF '[APP-FIX-098]' app/app/src/main/assets/float.html
          grep -qF '[APP-FIX-099]' $K/NativeEngine.kt
          grep -qF '[APP-FIX-100]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-102]' $K/NativeEngine.kt
          grep -qF '[APP-FIX-103]' app/app/src/main/assets/index.html
          grep -qF '[APP-FIX-104]' app/app/src/main/assets/index.html
          grep -qF 'startOne' $K/EngineBridge.kt
          grep -qF '[APP-FIX-105]' $K/FrameAdapter.kt
          grep -qF '[APP-FIX-105]' $K/EngineBridge.kt
          grep -qF '[APP-FIX-105]' $K/NativeEngine.kt
          grep -qF '[APP-FIX-105]' app/app/src/main/assets/index.html
          grep -qF '[APP-BOARD-3297]' app/app/src/main/assets/index.html
          grep -qF 'turn_engine' $K/NativeEngine.kt
          grep -qF '[APP-FIX-105]' .github/scripts/summary_to_frame.js
          sed -i 's/versionName = "[^"]*"/versionName = "0.9.33-dsh42"/' app/app/build.gradle.kts
          sed -i 's/versionCode = [0-9]\+/versionCode = 58/' app/app/build.gradle.kts
          grep -E 'versionCode|versionName' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble release
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -30
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-0.9.33-dsh42.apk
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-0.9.33-dsh42.apk app/dist/matsuri-ai-latest.apk
          git add -f app/app/src/main/java app/app/src/main/assets/index.html app/app/build.gradle.kts 2>/dev/null || true
          git add -u  # tracked 修改全暂存，否则 rebase 报 unstaged changes
          git commit -m "build(app): 0.9.33-dsh42 引擎决策+人头合成+流式布局修复" || echo nothing
          git fetch origin main || true
          git rebase origin/main || git rebase --abort || true
          git push origin HEAD:main || echo "push failed（禁止 force，防吞并提）"

      - name: Report (always)
        if: always()
        run: |
          { echo "job_status=${{ job.status }}"; tail -c 5000 app-capture.txt 2>/dev/null || true; } > ci-last-app-v26.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-app-v26.txt || true
          git commit -m "ci: app v26 log (${{ job.status }})" || echo nothing
          git pull --rebase --autostash || true
          git push || echo "push failed"