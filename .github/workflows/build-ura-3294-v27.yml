name: "Build hachimi_ura 3.29.6 (succession-factors)"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ura-3294-v27.yml"
      - "so/hachimi_ura_plugin/src/lib.rs"
      - "so/hachimi_ura_plugin/Cargo.toml"
  workflow_dispatch:
# publish-request 2026-11-12T12:12:23.458Z

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # [PURE-CAPTURE-3293] 仓库 lib.rs 即权威源码，不再重放任何 apply_* 补丁。
      # 算分/彩圈/运气/决策已全部剥离出 SO（移交 App 侧 ScoreTable.kt + 内置引擎），
      # 若重放 apply_score/apply_shining/apply_luck 会把已删除的启发式代码注回来。
      - name: Verify pure-capture + httpfix markers
        run: |
          set -euo pipefail
          grep -qF '[PURE-CAPTURE-3293]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF 'train_index_of_cmd' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[EVAL-3292]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[BOOTGATE-3292]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[PUSHFALLBACK-3292]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[HTTP-READFIX-3294]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[HTTP-PAGE-3294]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[HTTP-DIAG-3294]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[HTTP-CLOSE-3294]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '/debug/summary_integrity' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[SO-FIX-113]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF '[SO-FIX-114]' so/hachimi_ura_plugin/src/lib.rs
          grep -qF 'S:resp_written=' so/hachimi_ura_plugin/src/lib.rs
          ! grep -qF 'evaluate_ai' so/hachimi_ura_plugin/src/lib.rs
          ! grep -qF 'five_status_final_score' so/hachimi_ura_plugin/src/lib.rs
          ! grep -qF 'FIVE_STATUS_FINAL_SCORE' so/hachimi_ura_plugin/src/lib.rs
          echo "pure-capture + httpfix source verified"
      - name: Toolchain
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1 || true); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p so/hachimi_ura_plugin/.cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android24-clang"\n' "$TC" > so/hachimi_ura_plugin/.cargo/config.toml
          { echo "CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang"; echo "AR_aarch64_linux_android=$TC/llvm-ar"; } >> "$GITHUB_ENV"
      - name: Build
        working-directory: so/hachimi_ura_plugin
        run: |
          set -o pipefail
          cargo build --release --target aarch64-linux-android 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-capture.txt" | tail -40
          ls -l target/aarch64-linux-android/release/libhachimi_ura.so
      - name: Publish
        if: success()
        run: |
          set -euo pipefail
          mkdir -p so/dist
          cp so/hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so so/dist/libhachimi_ura-3.29.6-succfactors.so
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f so/dist/libhachimi_ura-3.29.6-succfactors.so
          git add -u
          git commit -m "build(so): 3.29.6 种马因子明细透传（蓝因子星数→zhongMaBlueCount，按局种子缓存）" || echo nothing
          git fetch origin main || true
          git rebase origin/main || git rebase --abort || true
          git push origin HEAD:main || echo "push failed（禁止 force，防吞并提）"
      - name: Report
        if: always()
        run: |
          { echo "job_status=${{ job.status }}"; tail -c 6000 ci-capture.txt 2>/dev/null || true; } > ci-last-v27.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-v27.txt || true
          git commit -m "ci: v27 log (${{ job.status }})" || echo nothing
          git pull --rebase --autostash || true
          git push || echo "push failed"