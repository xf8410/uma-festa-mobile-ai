name: Build matsuri AI app (revert UI to 0.7.4 + score only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-app-revert.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-revert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 0.7.4 UI baseline (undo layout/window patches)
        run: |
          set -euo pipefail
          git checkout 4a0009f3 -- app/app/src/main
          git status --short | head -20
          echo "--- 还原后核对（应为 0.7.4 原样）"
          grep -c 'uicols' app/app/src/main/assets/index.html || true
          grep -c 'APP-FIX-07' app/app/src/main/assets/index.html || true
          grep -c 'SMALL_URL' app/app/src/main/java/com/ranko/matsuricapture/FloatingWindowService.kt || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Stable debug keystore
        run: |
          set -e
          mkdir -p app/ci
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/ci/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Apply ONLY the score wiring
        run: |
          set -euo pipefail
          : > app-capture.txt
          node .github/scripts/apply_appfix_080.js \
            app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt \
            app/app/src/main/assets/index.html \
            app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          grep -qF 'APP-FIX-080' app/app/src/main/java/com/ranko/matsuricapture/NativeEngine.kt
          # 版本号 0.8.0-dsh6
          sed -i 's/versionCode = [0-9]\+/versionCode = 23/; s/versionName = "[^"]*"/versionName = "0.8.0-dsh6"/' app/app/build.gradle.kts
          grep -E 'versionCode|versionName' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble release
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -40
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish APK
        run: |
          set -e
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          cp "$SRC" app/dist/matsuri-ai-0.8.0-dsh6.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-latest.apk app/dist/matsuri-ai-0.8.0-dsh6.apk app/app/src/main
          git commit -m "build(app): 0.8.0-dsh6 revert UI to 0.7.4 + score wiring only" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: matsuri-ai-0.8.0-dsh6
          path: app/dist/matsuri-ai-0.8.0-dsh6.apk

      - name: Report (always)
        if: always()
        run: |
          {
            echo "job_status=${{ job.status }}"
            tail -c 6000 app-capture.txt 2>/dev/null || echo "no capture"
          } > ci-last-app-revert.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-app-revert.txt || true
          git commit -m "ci: revert build log (${{ job.status }})" || echo nothing
          git push || echo "push failed"