name: "Engine replay test"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/engine-replay-test.yml"
      - ".github/scripts/summary_to_frame.js"
      - ".github/fixtures/summary_min.json"
      - ".github/fixtures/summary_real.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo + engine build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/w
          key: engine-replay-v7

      - name: Build + replay + push log
        run: |
          set -o pipefail
          OUT="/tmp/replay-log.txt"
          : > "$OUT"
          say() { echo "$@" | tee -a "$OUT"; }
          mkdir -p /tmp/w
          [ -d /tmp/w/umaai_next/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-next.git /tmp/w/umaai_next > /dev/null 2>&1
          [ -d /tmp/w/umaai-matsuri/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/w/umaai-matsuri > /dev/null 2>&1
          cd /tmp/w/umaai-matsuri
          cargo build --release -p matsuri-cli 2>&1 | tail -3 | tee -a "$OUT"
          export CARD_DB=/tmp/w/umaai-matsuri/data/cardDB.json
          # 真机样本优先：base64+gzip → JSON
          base64 -d "$GITHUB_WORKSPACE/.github/fixtures/summary_real.b64" | gunzip > /tmp/summary_real.json
          say "real_summary_bytes=$(wc -c < /tmp/summary_real.json)"
          node "$GITHUB_WORKSPACE/.github/scripts/summary_to_frame.js" /tmp/summary_real.json > /tmp/frame_real.json
          say "real_frame_bytes=$(wc -c < /tmp/frame_real.json)"
          rm -rf ci-frames && mkdir -p ci-frames
          cp /tmp/frame_real.json ci-frames/game102003_turn12.json
          set +e
          timeout 300 ./target/release/matsuri online --replay ./ci-frames --json > /tmp/out_real.json 2> /tmp/err_real.txt
          RC=$?
          set -e
          say "exit=$RC"
          say "---- stdout(real) ----"
          head -c 4000 /tmp/out_real.json >> "$OUT"
          say "---- stderr(real) ----"
          head -c 3000 /tmp/err_real.txt >> "$OUT"
          say "---- end ----"
          cat "$OUT"
          cd "$GITHUB_WORKSPACE"
          cp "$OUT" ./ci-last-replay.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git checkout -B ci-log > /dev/null 2>&1
          git add -f ci-last-replay.txt
          git commit -m "ci: replay log (exit=$RC)" || echo "nothing to commit"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-log || echo "push failed"