name: "Engine replay test"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/engine-replay-test.yml"
      - ".github/scripts/summary_to_frame.js"
      - ".github/scripts/apply_engine_json_panel.js"
      - ".github/fixtures/summary_real.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/w
          [ -d /tmp/w/umaai_next/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-next.git /tmp/w/umaai_next
          [ -d /tmp/w/umaai-matsuri/.git ] || git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/w/umaai-matsuri

      - name: Patch engine JSON to carry panel fields
        run: |
          set -euo pipefail
          node .github/scripts/apply_engine_json_panel.js /tmp/w/umaai-matsuri/crates/matsuri-ai/src/output.rs

      - name: Build engine
        working-directory: /tmp/w/umaai-matsuri
        run: |
          set -euo pipefail
          cargo build --release -p matsuri-cli 2>&1 | tail -5

      - name: Replay our real frame (search) and dump JSON
        run: |
          set -o pipefail
          OUT="$GITHUB_WORKSPACE/ci-last-replay.txt"
          : > "$OUT"
          say() { echo "$@" | tee -a "$OUT"; }
          cd /tmp/w/umaai-matsuri
          export CARD_DB=/tmp/w/umaai-matsuri/data/cardDB.json
          base64 -d "$GITHUB_WORKSPACE/.github/fixtures/summary_real.b64" | gunzip > /tmp/summary_real.json
          node "$GITHUB_WORKSPACE/.github/scripts/summary_to_frame.js" /tmp/summary_real.json > /tmp/frame.json
          rm -rf ci-frames && mkdir -p ci-frames
          cp /tmp/frame.json ci-frames/game102003_turn12.json
          set +e
          timeout 300 ./target/release/matsuri online --replay ./ci-frames --trainer search --json > /tmp/out.json 2> /tmp/err.txt
          RC=$?
          set -e
          say "exit=$RC"
          say "---- decision json ----"
          head -c 4000 /tmp/out.json >> "$OUT"
          say "---- stderr ----"
          head -c 1000 /tmp/err.txt >> "$OUT"
          say "---- end ----"
          cat "$OUT"
          cd "$GITHUB_WORKSPACE"
          cp "$OUT" ./ci-last-replay.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git checkout -B ci-log > /dev/null 2>&1
          git add -f ci-last-replay.txt
          git commit -m "ci: replay log (panel json)" || echo nothing
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-log || echo "push failed"