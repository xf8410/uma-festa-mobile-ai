name: Sync ai-engine
# touch: 2026-11-08T22:16+08:00 触发同步（上游 4bc0e653 fcthreads/期望分投影/运气分）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-ai-engine2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Mirror upstream and commit
        run: |
          set -e
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git /tmp/up
          cd /tmp/up
          SHA=$(git rev-parse HEAD)
          MSG=$(git log -1 --format='%h %s')
          cd "$GITHUB_WORKSPACE"
          rm -rf ai-engine/umaai-matsuri
          mkdir -p ai-engine/umaai-matsuri
          cp -a /tmp/up/. ai-engine/umaai-matsuri/
          rm -rf ai-engine/umaai-matsuri/.git ai-engine/umaai-matsuri/target
          rm -f ai-engine/umaai-matsuri/data/*.json ai-engine/umaai-matsuri/data/*.mdb
          find ai-engine/umaai-matsuri -type f | wc -l
          printf '%s\n' "# ai-engine 上游同步" "" "- 上游 https://github.com/umaai-project/umaai-matsuri" "- commit $SHA" "- 最近提交 $MSG" "- 说明：手机端 App 是 Kotlin+WebView JS，不能直接运行本 Rust 引擎；此目录用于对照规则与移植。" > ai-engine/UPSTREAM_SYNC.md
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -A ai-engine
          git commit -m "chore(ai-engine): sync upstream umaai-matsuri" || echo "nothing to commit"
          git push || echo "push failed"