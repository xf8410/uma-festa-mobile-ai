name: Build app with embedded score table
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-app-scoretable.yml"
      - ".github/scripts/apply_scoretable_app.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app-scoretable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 0.7.4 baseline
        run: |
          git checkout 4a0009f3 -- app/app/src/main
          echo restored

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Keystore
        run: |
          mkdir -p app/ci
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/ci/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Embed score table + compute in app
        run: |
          set -e
          : > app-capture.txt
          node .github/scripts/apply_scoretable_app.js app/app/src/main/java/com/ranko/matsuricapture 2>&1 | tee -a app-capture.txt
          grep -c 'ScoreTable' app/app/src/main/java/com/ranko/matsuricapture/ScoreTable.kt
          sed -i 's/versionCode = [0-9]\+/versionCode = 26/; s/versionName = "[^"]*"/versionName = "0.9.0-dsh9"/' app/app/build.gradle.kts
          grep -E 'versionCode|versionName' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -40
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish
        run: |
          set -e
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          cp "$SRC" app/dist/matsuri-ai-0.9.0-dsh9.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-latest.apk app/dist/matsuri-ai-0.9.0-dsh9.apk app/app/src/main app/ci/debug.keystore
          git commit -m "build(app): 0.9.0-dsh9 embedded score table" || echo nothing
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: matsuri-ai-0.9.0-dsh9
          path: app/dist/matsuri-ai-0.9.0-dsh9.apk

      - name: Report
        if: always()
        run: |
          { echo "job_status=${{ job.status }}"; tail -c 5000 app-capture.txt 2>/dev/null || true; } > ci-last-scoretable.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-scoretable.txt || true
          git commit -m "ci: scoretable log" || echo nothing
          git push || echo "push failed"