name: Build matsuri AI app
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/dist/**"
      - ".github/workflows/build-app.yml"
      - ".github/scripts/apply_appfix_075.js"
      - ".github/scripts/apply_appfix_076.js"
      - ".github/scripts/apply_appfix_077.js"
      - ".github/scripts/apply_appfix_078.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Stable debug keystore
        run: |
          set -e
          mkdir -p app/ci
          if [ ! -f app/ci/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/ci/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.android"
          cp app/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Apply app patches
        run: |
          set -e
          : > app-capture.txt
          node .github/scripts/apply_appfix_075.js app/app/src/main/assets/float.html app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_076.js app/app/src/main/assets/float.html app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_077.js app/app/src/main/java/com/ranko/matsuricapture/FloatingWindowService.kt app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          node .github/scripts/apply_appfix_078.js app/app/src/main/java/com/ranko/matsuricapture/FloatingWindowService.kt app/app/build.gradle.kts 2>&1 | tee -a app-capture.txt
          grep -qF 'APP-FIX-078' app/app/src/main/java/com/ranko/matsuricapture/FloatingWindowService.kt
          grep -qF 'versionName = "0.7.8-dsh3"' app/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble release
        run: |
          set -o pipefail
          gradle -p app --no-daemon assembleRelease 2>&1 | tee -a app-capture.txt | tail -50
          find app/app/build/outputs -name "*.apk" -ls

      - name: Publish APK
        run: |
          set -e
          mkdir -p app/dist
          SRC=$(find app/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$SRC" app/dist/matsuri-ai-latest.apk
          cp "$SRC" app/dist/matsuri-ai-0.7.8-dsh3.apk
          ls -l app/dist/
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add -f app/dist/matsuri-ai-latest.apk app/dist/matsuri-ai-0.7.8-dsh3.apk app/ci/debug.keystore \
            app/app/src/main/assets/float.html app/app/build.gradle.kts \
            app/app/src/main/java/com/ranko/matsuricapture/FloatingWindowService.kt
          git commit -m "build(app): 0.7.8-dsh3 three-mode overlay (run ${{ github.run_id }})" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: matsuri-ai-0.7.8-dsh3
          path: app/dist/matsuri-ai-0.7.8-dsh3.apk

      - name: Report (always)
        if: always()
        run: |
          {
            echo "job_status=${{ job.status }}"
            tail -c 6000 app-capture.txt 2>/dev/null || echo "no capture"
          } > ci-last-app.txt
          git config user.name dsh-bot
          git config user.email dsh-bot@users.noreply.github.com
          git add ci-last-app.txt || true
          git commit -m "ci: app build log (${{ job.status }})" || echo nothing
          git push || echo "push failed"